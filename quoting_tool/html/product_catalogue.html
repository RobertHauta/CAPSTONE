<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../lib/bootstrap.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../../lib/sweetalert2.js"></script>
    <script src="../../lib/JQuery/jquery_v3_7_1.js"></script>
</head>
<body>
     <div class="sticky-top">
         <nav class="py-2 bg-body-tertiary border-bottom">
            <div class="container flex-wrap">
              <ul class="nav">
                <li class="nav-item"><a href="#" id="ProductButton" class="nav-link link-body-emphasis px-2" aria-current="page">Products</a></li>
                <li class="nav-item"><a href="#" id="TemplateButton" class="NavButton nav-link link-body-emphasis px-2">Templates</a></li>
                <li class="nav-item"><a href="#" id="QuoteButton" class="NavButton nav-link link-body-emphasis px-2">Quote</a></li>
                <li class="nav-item me-auto"><a href="#" id="TakeoffButton" class="NavButton nav-link link-body-emphasis px-2">Takeoff</a></li>
                <li class="nav-item"><a href="#" id="ExitButton" class="NavButton nav-link link-body-emphasis px-2">Exit</a></li>
              </ul>
            </div>
          </nav>
          <header class="py-3 mb-2 border-bottom bg-body">
            <div class="container d-flex flex-wrap justify-content-center">
              <div class="d-flex align-items-center mb-3 mb-lg-0 me-lg-auto">
                <img class="EpicLogo me-2 mt-2" src="https://cdn.prod.website-files.com/60be4c4cf9fd9f61795a5135/60be8f6a4225b441148eeba5_Epic_Logo.svg" alt="Epic Logo">
                <span class="fs-2">Product Catalogue</span>
              </div>
              
              <div class="d-flex align-items-center col-12 col-lg-auto mb-3 mb-lg-0">
                <button id="TopButton" class="IconButton btn btn-outline-danger me-2" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-chevron-bar-up" viewBox="0 0 16 16">
                      <path fill-rule="evenodd" d="M3.646 11.854a.5.5 0 0 0 .708 0L8 8.207l3.646 3.647a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 0 0 0 .708M2.4 5.2c0 .22.18.4.4.4h10.4a.4.4 0 0 0 0-.8H2.8a.4.4 0 0 0-.4.4"/>
                    </svg>
                </button>
                <button id="FilterButton" class="IconButton btn btn-outline-danger me-2" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-funnel" viewBox="0 0 16 16">
                      <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z"/>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
                      <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                    </svg>
                </button>
                
                <input type="search" id="SearchBar" class="form-control me-2" placeholder="Search..." aria-label="Search">
                <button id="SearchButton" class="IconButton btn btn-outline-danger" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                    </svg>
                </button>
              </div>
            </div>
          </header>
      </div>
     
     <table id="ProductTable" class="table table-striped table-bordered table-hover">
      <thead class="table-dark StickyHeader">
        <tr>
          <th>Product</th>
          <th>Unit</th>
          <th>Purchase Unit</th>
          <th><select class='Filter' id="Make"><option value="Make">Make</option></select></th>
          <th><select class='Filter' id="Cat1"><option value="Cat1">Category 1</option></select></th>
          <th><select class='Filter' id="Cat2"><option value="Cat2">Category 2</option></select></th>
          <th><select class='Filter' id="Cat3"><option value="Cat3">Category 3</option></select></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
      </tbody>
     </table>
     

    <script src="../js/product_catalogue.js" charset="utf-8"></script>
</body>

</html>
