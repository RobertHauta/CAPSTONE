<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../lib/bootstrap.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../../lib/JQuery/jquery_v3_7_1.js"></script>
</head>
<body>
    <div class="PageTop">
        <img class="EpicLogo" src="https://cdn.prod.website-files.com/60be4c4cf9fd9f61795a5135/60be8f6a4225b441148eeba5_Epic_Logo.svg" alt="Epic Logo">
        <h1>Quote Templates</h1>
        <input id="SearchBar" type="search" placeholder="Search" aria-label="Search">
        <button id="SearchButton" class="btn btn-secondary" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
            </svg>
         </button>
        <div class='MenuButtons'>
            <button id="QuoteButton" class="btn btn-primary" type="button">Quote</button>
            <button id="ProductButton" class="btn btn-primary" type="button">Products</button>
        </div>
    </div>
    
    <table id="TemplateTable" class="table table-striped table-bordered table-hover">
     <thead class="table-dark">
       <tr>
         <th>Template</th>
         <th>Product</th>
         <th>Unit</th>
         <th>Purchase Unit</th>
         <th><select class='Filter' id="Make">
           <option value="Make">Make</option>
           </select></th>
         <th><select class='Filter' id="Cat1"><option value="Cat1">Category 1</option></select></th>
         <th><select class='Filter' id="Cat2"><option value="Cat2">Category 2</option></select></th>
         <th><select class='Filter' id="Cat3"><option value="Cat3">Category 3</option></select></th>
         <th><button id="TopButton" class="btn btn-primary" type="button">Top</button></th>
       </tr>
     </thead>
     <tbody>
     </tbody>
    </table>
    

   <script src="../js/template_manager.js" charset="utf-8"></script>
</body>
</html>
